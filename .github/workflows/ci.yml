name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Generated *_templ.go files are committed (a clean checkout must build
      # with plain `go build`), so CI only checks that they match the .templ
      # sources. Pinned to the version required in go.mod (see tools.go): a
      # newer CLI can emit code the pinned runtime cannot compile.
      - name: install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

      - name: templ sources match committed generated code
        run: |
          templ generate
          if ! git diff --exit-code -- internal/web/views; then
            echo "::error::internal/web/views is stale — run 'make generate' and commit the result"
            exit 1
          fi

      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^prototype/' || true)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: console js behaviour (update panel)
        run: node internal/web/ui/_update-panel.test.mjs

      - name: cross-compile smoke (linux amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/agent-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/agent-relay

      - name: e2e (amd64 binary, local server)
        run: |
          go build -o ./agent-relay-ci ./cmd/agent-relay
          BIN=./agent-relay-ci ./clients/e2e.sh http://127.0.0.1:18789
