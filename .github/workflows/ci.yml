name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^prototype/' || true)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: console js behaviour (update panel, command console state)
        run: make test-ui-js

      - name: cross-compile smoke (linux amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/agent-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/agent-relay

      - name: e2e (amd64 binary, local server)
        run: |
          go build -o ./agent-relay-ci ./cmd/agent-relay
          BIN=./agent-relay-ci ./clients/e2e.sh http://127.0.0.1:18789
