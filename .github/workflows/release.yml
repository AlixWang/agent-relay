name: Release

# 打 tag 触发：git tag v0.1.0 && git push origin v0.1.0
# 产物：GitHub Release 双架构二进制 + SHA256 + GHCR 多架构镜像。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/alixwang/agent-relay

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5 # pinned major; runner resolves via tags
        with:
          go-version-file: go.mod
          cache: true

      - name: debug workspace
        run: pwd; ls -la; ls cmd/agent-relay || true

      - name: install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: generate templ files
        run: templ generate

      - name: build (linux amd64 + arm64, CGO off, pure Go)
        id: build
        run: |
          mkdir -p dist
          # Receiver source revision (DESIGN §8.9): hash of cmd/relay-tail/**/*.go.
          # relay-tail is stdlib-only, so this content hash fully identifies the
          # receiver's behaviour. Both binaries bake it; the server nudges
          # client_update only when a client's rev differs, so releases that do
          # not touch the receiver never ask anyone to swap binaries.
          RECEIVER_REV=$(find cmd/relay-tail -name '*.go' -type f | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-12)
          echo "receiver_rev=${RECEIVER_REV}" >> "$GITHUB_OUTPUT"
          LDFLAGS="-X github.com/AlixWang/agent-relay/internal/web.assetVersion=${GITHUB_REF_NAME} -X github.com/AlixWang/agent-relay/internal/gateway.receiverRev=${RECEIVER_REV}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/agent-relay-linux-amd64 ./cmd/agent-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/agent-relay-linux-arm64 ./cmd/agent-relay
          # relay-tail receiver prototype (dumb pipe: poll|sse, DESIGN §8.9).
          # Same matrix; assistants fetch it like the shell scripts.
          # clientVersion (release tag, for display/download) + receiverRev
          # (source identity, for the update check) ride the heartbeat.
          RLDFLAGS="$LDFLAGS -X main.clientVersion=${GITHUB_REF_NAME} -X main.receiverRev=${RECEIVER_REV}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$RLDFLAGS" \
            -o dist/relay-tail-linux-amd64 ./cmd/relay-tail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$RLDFLAGS" \
            -o dist/relay-tail-linux-arm64 ./cmd/relay-tail
          (cd dist && sha256sum agent-relay-linux-* relay-tail-linux-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: verify baked receiver revision
        run: |
          # A build that silently dropped the ldflag would make every release
          # nag every client again — fail loudly instead.
          for b in dist/agent-relay-linux-amd64 dist/relay-tail-linux-amd64; do
            if ! grep -aq "${{ steps.build.outputs.receiver_rev }}" "$b"; then
              echo "$b is missing receiver_rev=${{ steps.build.outputs.receiver_rev }}"; exit 1
            fi
          done
          echo "receiver_rev baked ok: ${{ steps.build.outputs.receiver_rev }}"

      - name: generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          REPO="${{ github.repository }}"
          TAG_MSG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^$/d' | head -n 1)

          {
            if [ -n "$TAG_MSG" ]; then
              echo "### ${TAG_MSG}"
              echo ""
            fi
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --no-merges --pretty=format:"* %s ([%h](https://github.com/${REPO}/commit/%H)) by @%an")
              if [ -z "$COMMITS" ]; then
                COMMITS=$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --pretty=format:"* %s ([%h](https://github.com/${REPO}/commit/%H)) by @%an")
              fi
              echo "$COMMITS"
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            else
              git log "${GITHUB_REF_NAME}" --no-merges --pretty=format:"* %s ([%h](https://github.com/${REPO}/commit/%H)) by @%an"
            fi
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/agent-relay-linux-amd64
            dist/agent-relay-linux-arm64
            dist/relay-tail-linux-amd64
            dist/relay-tail-linux-arm64
            dist/SHA256SUMS

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # latest major; v4+ does not exist

      - uses: docker/setup-buildx-action@v3 # latest major; v4+ does not exist

      - uses: docker/login-action@v3 # latest major; v4/v5 do not exist
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v5 # v5 verified; avoids unreleased-major resolution failure
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            RECEIVER_REV=${{ steps.build.outputs.receiver_rev }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
