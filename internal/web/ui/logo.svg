<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#212944"/>
      <stop offset="100%" stop-color="#111524"/>
    </linearGradient>
    <linearGradient id="rim" x1="32" y1="1" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="arcA" x1="15" y1="38" x2="43" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#5E6AD2"/>
    </linearGradient>
    <linearGradient id="arcB" x1="49" y1="26" x2="21" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F5BD5"/>
    </linearGradient>
    <radialGradient id="halo" cx="32" cy="32" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5277" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="28" y1="27" x2="36" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A96"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <!-- Squircle badge -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.25"/>
  <!-- Inner orbital telemetry echoes -->
  <path d="M22.2 28.0 A10.6 10.6 0 0 1 32.7 21.4" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <path d="M41.8 36.0 A10.6 10.6 0 0 1 31.3 42.6" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <!-- Opposing precision relay arcs -->
  <path d="M16.0 37.2 A16.8 16.8 0 0 1 42.3 18.8" stroke="url(#arcA)" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M48.0 26.8 A16.8 16.8 0 0 1 21.7 45.2" stroke="url(#arcB)" stroke-width="5.6" stroke-linecap="round"/>
  <!-- Central Coral Pulse core -->
  <circle cx="32" cy="32" r="8.6" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="4.8" fill="url(#core)"/>
